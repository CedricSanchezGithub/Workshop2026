[project]
name = "resilience-ai"
version = "0.1.0"
description = "Pilier IA/Data de RESILIENCE-ALPHA : détection d'anomalies et assistant RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147.0",
    "httpx>=0.28",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pypdf>=6.21.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
