# Site de documentation de la gouvernance — POC du pilier Gouvernance
#   docker compose -f docs/gouvernance/site/docker-compose.yml up --build -d
#   puis http://127.0.0.1:8096
name: gouvernance-site

services:
  site:
    build:
      context: ..            # docs/gouvernance : le site est construit à partir des .md
      dockerfile: site/Dockerfile
    ports:
      # Local uniquement : l'accès extérieur passe par Tailscale (funnel), qui relaie vers ce
      # port. Ne pas publier directement sur le réseau RESILIENCE-G6.
      - "127.0.0.1:8096:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
