# Dossier contenant docker-compose.yml (infra/ à la racine du dépôt)
infra_dir: "{{ (inventory_dir ~ '/../../infra') | realpath }}"

compose_wait_timeout: 180

# HashiCorp Vault (WOR-62)
vault_addr: http://127.0.0.1:8200
# Clé de descellement, jeton root et identifiants AppRole : jamais dans Git (cf .gitignore "secrets/")
vault_secrets_dir: "{{ infra_dir }}/secrets"
vault_init_file: "{{ vault_secrets_dir }}/vault-init.json"
vault_approle_dir: "{{ vault_secrets_dir }}/approle"
vault_agent_role: platform-agent

# Secrets générés aléatoirement à la première installation (jamais écrasés ensuite).
# Chemin KV v2 : secret/platform/<name>, rendus en fichiers par vault-agent (infra/vault/agent.hcl).
vault_platform_secrets:
  - name: postgres
    key: password
  - name: grafana
    key: admin_password

# Comptes humains (userpass) : politique attribuée par playbooks/vault-user.yml
vault_admin_policy: admin

# Services dont les journaux doivent être présents dans Loki (vérifié par verify.yml, WOR-46)
loki_logged_services:
  - postgres
  - prometheus
  - loki
  - grafana
  - vault
  - vault-agent
  - socket-proxy
  - alloy
  - waf

# Fichiers de configuration montés dans chaque service (chemins relatifs à infra/) :
# deploy.yml redémarre le service si l'un d'eux est plus récent que son conteneur.
config_watch:
  prometheus: [prometheus]
  loki: [loki]
  grafana: [grafana]
  alloy: [alloy]
  vault: [vault/vault.hcl]
  vault-agent: [vault/agent.hcl]
  waf: [waf/templates]
