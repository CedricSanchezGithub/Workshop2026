# Recrée un service à partir de son image (attaque B : compromission/intégrité).
# payment-api est en mémoire : le recréer le remet dans l'état du seed, sans données altérées.
#   ansible-playbook playbooks/remediation/restore-service.yml -e service=payment-api
- name: Restaurer un service dans un état sain connu
  hosts: pc_hote
  gather_facts: false
  tasks:
    - name: Refuser un service hors de la liste fermée
      ansible.builtin.assert:
        that: service in remediation_services
        fail_msg: "Service non autorisé : {{ service }}"
        quiet: true

    - name: Recréer le conteneur et attendre le healthcheck
      community.docker.docker_compose_v2:
        project_src: "{{ infra_dir }}"
        services: ["{{ service }}"]
        state: present
        recreate: always
        wait: true
        wait_timeout: 90
