# Vérifie que chaque service répond réellement, pas seulement que son conteneur tourne.
# Usage (depuis ansible/) : ansible-playbook playbooks/verify.yml
- name: Vérifier le socle d'infrastructure
  hosts: pc_hote
  gather_facts: false
  vars:
    grafana_bind: "{{ lookup('ansible.builtin.ini', 'GRAFANA_BIND', type='properties', file=infra_dir ~ '/.env', default='127.0.0.1') }}"
    grafana_port: "{{ lookup('ansible.builtin.ini', 'GRAFANA_PORT', type='properties', file=infra_dir ~ '/.env', default='3000') }}"
    assistant_port: "{{ lookup('ansible.builtin.ini', 'ASSISTANT_PORT', type='properties', file=infra_dir ~ '/.env', default='8100') }}"
  tasks:
    - name: Vault est initialisé, descellé et actif
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/health"
      register: vault_health
      until: vault_health.status == 200
      retries: 10
      delay: 3

    - name: PostgreSQL accepte les connexions
      ansible.builtin.command:
        cmd: docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
        chdir: "{{ infra_dir }}"
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 10
      delay: 3
      changed_when: false

    # Connexion TCP (scram-sha-256) avec le mot de passe rendu par vault-agent
    - name: PostgreSQL accepte le mot de passe fourni par Vault
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T postgres sh -c
          'PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select 1"'
        chdir: "{{ infra_dir }}"
      register: pg_auth
      failed_when: pg_auth.rc != 0 or pg_auth.stdout | trim != '1'
      changed_when: false

    - name: Lister les conteneurs de la stack
      ansible.builtin.command:
        cmd: docker compose ps -q
        chdir: "{{ infra_dir }}"
      register: compose_containers
      changed_when: false

    - name: Inspecter l'environnement des conteneurs
      ansible.builtin.command:
        cmd: "docker inspect --format '{{ '{{' }}.Name{{ '}}' }} {{ '{{' }}json .Config.Env{{ '}}' }}' {{ compose_containers.stdout_lines | join(' ') }}"
      register: compose_env
      changed_when: false
      no_log: true

    - name: Aucun secret dans l'environnement des conteneurs
      ansible.builtin.assert:
        # Les variables *_FILE (chemin vers le fichier rendu par vault-agent) sont attendues.
        # SERVER_TOKENS est une directive nginx du WAF (masque la version), pas un secret.
        that: compose_env.stdout is not search('(PASSWORD|SECRET|TOKEN)[A-Z_]*(?<!_FILE)(?<!SERVER_TOKENS)=')
        fail_msg: "Un conteneur reçoit un secret en variable d'environnement (visible via docker inspect)."
        quiet: true

    - name: Inspecter le durcissement des conteneurs
      ansible.builtin.command:
        cmd: "docker inspect --format '{{ '{{' }}.Name{{ '}}' }}|{{ '{{' }}json .HostConfig.SecurityOpt{{ '}}' }}|{{ '{{' }}.HostConfig.CapDrop{{ '}}' }}' {{ compose_containers.stdout_lines | join(' ') }}"
      register: compose_sec
      changed_when: false

    - name: Tous les conteneurs durcis (no-new-privileges + cap_drop ALL, WOR-63)
      ansible.builtin.assert:
        # Moindre privilège sur TOUT conteneur du projet : interdiction d'élever ses droits,
        # et abandon de toutes les capacités Linux (celles réellement nécessaires sont
        # réintroduites explicitement par cap_add, ex. postgres).
        that:
          - compose_sec.stdout_lines | reject('search', 'no-new-privileges') | list | length == 0
          - compose_sec.stdout_lines | reject('search', 'ALL') | list | length == 0
        fail_msg: >-
          Un conteneur n'est pas durci (no-new-privileges ou cap_drop ALL manquant) :
          {{ compose_sec.stdout_lines | reject('search', 'no-new-privileges') | list
             + (compose_sec.stdout_lines | reject('search', 'ALL') | list) }}
        quiet: true

    - name: Prometheus est prêt
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
      register: prom_ready
      until: prom_ready.status == 200
      retries: 20
      delay: 3

    # L'ingester de Loki attend ~15 s après le démarrage avant d'être prêt
    - name: Loki est prêt
      ansible.builtin.uri:
        url: http://127.0.0.1:3100/ready
      register: loki_ready
      until: loki_ready.status == 200
      retries: 30
      delay: 3

    # Chaque service doit avoir un flux de journaux dans Loki (sur la durée de rétention, 7 j) :
    # un service silencieux depuis son démarrage n'a pas de ligne récente, mais son flux existe.
    - name: Les journaux de chaque service arrivent dans Loki
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:3100/loki/api/v1/series?match[]={{ '{platform="resilience-alpha"}' | urlencode }}&start={{ ((now().timestamp() - 604800) * 1000000000) | int }}
        return_content: true
      register: loki_streams
      until: >-
        loki_streams.status == 200
        and (loki_logged_services | difference(loki_streams.json.data | map(attribute='container') | list)) | length == 0
      retries: 20
      delay: 3

    - name: Grafana est sain (via son port publié)
      ansible.builtin.uri:
        url: "http://{{ grafana_bind }}:{{ grafana_port }}/api/health"
        return_content: true
      register: grafana_health
      until: grafana_health.status == 200 and grafana_health.json.database == 'ok'
      retries: 20
      delay: 3

    - name: Lire le mot de passe admin Grafana rendu par vault-agent
      ansible.builtin.command:
        cmd: docker compose exec -T grafana cat /run/secrets/grafana/admin_password
        chdir: "{{ infra_dir }}"
      register: grafana_admin_password
      changed_when: false
      no_log: true

    - name: Grafana accepte le mot de passe fourni par Vault
      ansible.builtin.uri:
        url: "http://{{ grafana_bind }}:{{ grafana_port }}/api/org"
        url_username: "{{ lookup('ansible.builtin.ini', 'GRAFANA_ADMIN_USER', type='properties', file=infra_dir ~ '/.env') }}"
        url_password: "{{ grafana_admin_password.stdout }}"
        force_basic_auth: true
      no_log: true

    - name: Toutes les cibles Prometheus sont UP
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/api/v1/query?query=up
        return_content: true
      register: up_query
      until: >-
        up_query.status == 200
        and up_query.json.data.result | length > 0
        and up_query.json.data.result | map(attribute='value') | map('last') | reject('equalto', '1') | list | length == 0
      retries: 20
      delay: 3

    - name: Vérifier la chaîne de reprise autonome (WAF, détection ML, moteur, transaction de test)
      ansible.builtin.include_tasks:
        file: tasks/verify-remediation.yml
        apply:
          tags: [remediation]
      tags: [remediation]

    # Informatif : l'assistant démarre sans Ollama et indexe dès qu'il répond. Sous Linux, Ollama doit
    # écouter au-delà de 127.0.0.1 pour être joint depuis le conteneur (rag/README.md).
    - name: État de l'assistant RAG (Ollama joignable, documentation indexée)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ assistant_port }}/health"
        return_content: true
        status_code: [200, 503]
      register: assistant_health
      failed_when: false

    - name: Résumé
      ansible.builtin.debug:
        msg:
          - "Cibles Prometheus UP : {{ up_query.json.data.result | map(attribute='metric.job') | sort | join(', ') }}"
          - "Journaux dans Loki : {{ loki_streams.json.data | map(attribute='container') | unique | sort | join(', ') }}"
          - "Grafana    : http://{{ grafana_bind }}:{{ grafana_port }}"
          - "Vault      : {{ vault_addr }}/ui (jeton root dans infra/secrets/vault-init.json)"
          - "Prometheus : http://127.0.0.1:9090"
          - "Loki       : http://127.0.0.1:3100"
          - "Supervision (moteur de remédiation) : http://127.0.0.1:{{ remediation_port }}"
          - "Assistant RAG : http://127.0.0.1:{{ assistant_port }} — {{ assistant_health.json | default(assistant_health.msg | default('injoignable')) }}"
