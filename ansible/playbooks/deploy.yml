# Déploiement reproductible du socle sur le PC Hôte.
# Usage (depuis ansible/) : ansible-playbook playbooks/deploy.yml
- name: Déployer le socle d'infrastructure RESILIENCE-ALPHA
  hosts: pc_hote
  gather_facts: false
  tasks:
    - name: Lire la version de Docker Compose
      ansible.builtin.command: docker compose version --short
      register: compose_version
      changed_when: false

    - name: Exiger Docker Compose >= 2.20
      ansible.builtin.assert:
        that: compose_version.stdout | regex_replace('^v', '') is version('2.20.0', '>=')
        fail_msg: "Docker Compose {{ compose_version.stdout }} est trop ancien (>= 2.20 requis)."
        quiet: true

    - name: Créer .env à partir de .env.example (uniquement s'il n'existe pas)
      ansible.builtin.copy:
        src: "{{ infra_dir }}/.env.example"
        dest: "{{ infra_dir }}/.env"
        mode: "0600"
        force: false
      register: env_file

    - name: Remplacer les mots de passe d'exemple par des secrets aléatoires
      ansible.builtin.lineinfile:
        path: "{{ infra_dir }}/.env"
        regexp: "^{{ item }}="
        line: "{{ item }}={{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      loop: "{{ generated_secrets }}"
      when: env_file.changed
      no_log: true

    - name: Lire .env
      ansible.builtin.slurp:
        src: "{{ infra_dir }}/.env"
      register: env_content
      no_log: true

    - name: Refuser de déployer avec un mot de passe d'exemple
      ansible.builtin.assert:
        that: (env_content.content | b64decode) is not search('(?m)^[A-Z_]+=change-me\s*$')
        fail_msg: "infra/.env contient encore 'change-me' : remplacez les mots de passe ou supprimez .env pour le régénérer."
        quiet: true

    - name: Démarrer la stack et attendre les healthchecks
      community.docker.docker_compose_v2:
        project_src: "{{ infra_dir }}"
        state: present
        pull: missing
        wait: true
        wait_timeout: "{{ compose_wait_timeout }}"

- name: Vérifier la plateforme
  ansible.builtin.import_playbook: verify.yml
