# Déploiement reproductible du socle sur le PC Hôte.
# Usage (depuis ansible/) : ansible-playbook playbooks/deploy.yml
- name: Déployer le socle d'infrastructure RESILIENCE-ALPHA
  hosts: pc_hote
  gather_facts: false
  tasks:
    # community.docker 5.x (requirements.yml) exige ansible-core >= 2.17
    - name: Exiger ansible-core >= 2.17
      ansible.builtin.assert:
        that: ansible_version.full is version('2.17.0', '>=')
        fail_msg: "ansible-core {{ ansible_version.full }} est trop ancien (>= 2.17 requis) : pipx install ansible-core"
        quiet: true

    - name: Lire la version de Docker Compose
      ansible.builtin.command: docker compose version --short
      register: compose_version
      changed_when: false

    - name: Exiger Docker Compose >= 2.20
      ansible.builtin.assert:
        that: compose_version.stdout | regex_replace('^v', '') is version('2.20.0', '>=')
        fail_msg: "Docker Compose {{ compose_version.stdout }} est trop ancien (>= 2.20 requis)."
        quiet: true

    # .env ne contient que de la configuration non secrète
    - name: Créer .env à partir de .env.example (uniquement s'il n'existe pas)
      ansible.builtin.copy:
        src: "{{ infra_dir }}/.env.example"
        dest: "{{ infra_dir }}/.env"
        mode: "0600"
        force: false

    - name: Lire le groupe propriétaire du socket Docker
      ansible.builtin.stat:
        path: /var/run/docker.sock
      register: docker_socket

    # socket-proxy (collecte des journaux, WOR-46) rejoint ce groupe pour lire le socket
    - name: Renseigner DOCKER_GID dans .env
      ansible.builtin.lineinfile:
        path: "{{ infra_dir }}/.env"
        regexp: "^DOCKER_GID="
        line: "DOCKER_GID={{ docker_socket.stat.gid }}"

    - name: Lire .env
      ansible.builtin.slurp:
        src: "{{ infra_dir }}/.env"
      register: env_content
      no_log: true

    - name: Refuser un mot de passe dans .env (les secrets vivent dans Vault)
      ansible.builtin.assert:
        that: (env_content.content | b64decode) is not search('(?m)^[A-Z_]*(PASSWORD|SECRET|TOKEN)[A-Z_]*=')
        fail_msg: "infra/.env contient un secret : supprimez la ligne, les mots de passe sont gérés par Vault (WOR-62)."
        quiet: true

    - name: Appliquer les fichiers de configuration modifiés
      ansible.builtin.include_tasks: tasks/restart-on-config-change.yml

    - name: Initialiser, desceller et configurer Vault
      ansible.builtin.include_tasks: tasks/vault-bootstrap.yml

    # Le WAF refuse de démarrer si la liste de blocage de la remédiation (WOR-38) est absente
    # (ignorée par Git) : on la crée avec sa seule adresse de documentation.
    - name: Créer la liste de blocage du WAF si elle n'existe pas
      ansible.builtin.copy:
        dest: "{{ remediation_blocklist }}"
        content: "{{ remediation_blocklist_placeholder }}\n"
        mode: "0644"
        force: false

    - name: Démarrer la stack et attendre les healthchecks
      community.docker.docker_compose_v2:
        project_src: "{{ infra_dir }}"
        state: present
        pull: missing
        wait: true
        wait_timeout: "{{ compose_wait_timeout }}"

- name: Vérifier la plateforme
  ansible.builtin.import_playbook: verify.yml
