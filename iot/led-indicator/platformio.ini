; Firmware ESP8266 — indicateur LED bicolore (WOR-99)
; IDE : JetBrains CLion + PlatformIO. Carte : NodeMCU v2 (ESP8266).
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -D POLL_INTERVAL_MS=400
