[project]
name = "resilience-ml"
version = "0.1.0"
description = "RESILIENCE-ALPHA — détection d'anomalies (labo, features, entraînement, inférence)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
