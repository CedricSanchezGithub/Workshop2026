<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant opérateur</title>
<style>
  :root {
    --ink: #261E48; --bg: #E4E6F3; --accent: #A1A6D4; --card: #ffffff; --muted: #5b5678;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #E4E6F3; --bg: #17132d; --accent: #4b4f86; --card: #221d3f; --muted: #a9a5c4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 Montserrat, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 140px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .msg { background: var(--card); border-radius: 10px; padding: 12px 14px; margin: 12px 0; overflow-wrap: anywhere; }
  .q { background: var(--accent); color: #261E48; margin-left: 15%; white-space: pre-wrap; }
  .err { color: #b3261e; white-space: pre-wrap; }
  @media (prefers-color-scheme: dark) { .err { color: #ffb4ab; } }
  /* Markdown rendu */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .6em; }
  .md h3, .md h4, .md h5, .md h6 { margin: .9em 0 .4em; line-height: 1.3; }
  .md h3 { font-size: 17px; } .md h4 { font-size: 16px; } .md h5, .md h6 { font-size: 15px; }
  .md ul, .md ol { margin: 0 0 .6em; padding-left: 1.4em; }
  .md li { margin: .15em 0; } .md li > ul, .md li > ol { margin: .15em 0; }
  .md code { font: 13px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace;
             background: var(--bg); border-radius: 4px; padding: .1em .35em; }
  .md pre { background: var(--bg); border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 .6em; }
  .md pre code { background: none; padding: 0; white-space: pre; }
  .md blockquote { margin: 0 0 .6em; padding: .2em .9em; border-left: 3px solid var(--accent); color: var(--muted); }
  .md table { border-collapse: collapse; margin: 0 0 .6em; display: block; overflow-x: auto; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--accent); padding: 4px 8px; text-align: left; vertical-align: top; }
  .md th { background: var(--bg); }
  .md hr { border: 0; border-top: 1px solid var(--accent); margin: .8em 0; }
  .md a { color: inherit; }
  .cite { display: inline-block; min-width: 1.5em; margin: 0 1px; padding: 0 .35em; border-radius: 999px;
          background: var(--accent); color: #261E48; font-size: 11px; font-weight: 700; line-height: 1.6;
          text-align: center; text-decoration: none; vertical-align: 1px; }
  a.cite:hover { filter: brightness(1.1); }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  details { margin-top: 8px; font-size: 13px; }
  details summary { cursor: pointer; }
  .src { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 6px 0; border-radius: 0 6px 6px 0;
         transition: background .6s; }
  .src.flash { background: var(--bg); }
  .src-head { font-weight: 600; margin-bottom: 4px; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); padding: 12px 16px 20px;
         border-top: 1px solid var(--accent); }
  .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 56px; border-radius: 8px; border: 1px solid var(--accent);
             padding: 8px 10px; font: inherit; background: var(--card); color: var(--ink); }
  button { border: 0; border-radius: 8px; padding: 0 18px; background: #261E48; color: #E4E6F3;
           font: inherit; font-weight: 600; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { background: #A1A6D4; color: #261E48; } }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<main>
  <h1>Assistant opérateur — RESILIENCE-ALPHA</h1>
  <p class="sub">Répond à partir de la documentation de l'équipe (runbooks, PCA/PRA, architecture). Lecture seule : il ne lance aucune action.</p>
  <div id="log"></div>
</main>
<form id="f">
  <div class="row">
    <textarea id="q" placeholder="Ex. : Que faire en cas d'alerte dos ?" maxlength="1000" required></textarea>
    <button id="b">Envoyer</button>
  </div>
</form>
<script src="static/markdown.js"></script>
<script>
const log = document.getElementById("log"), q = document.getElementById("q"), b = document.getElementById("b");

let msgCount = 0;

function bubble(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  d.scrollIntoView({behavior: "smooth"});
  return d;
}

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (question.length < 3) return;
  bubble("q", question);
  q.value = ""; b.disabled = true;
  const a = bubble("a", "…");
  const id = ++msgCount;
  const t0 = performance.now();
  try {
    const r = await fetch("ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                  body: JSON.stringify({question})});
    const raw = await r.text();
    let data;
    try { data = JSON.parse(raw); } catch { throw new Error(`HTTP ${r.status} — ${raw.slice(0, 200) || r.statusText}`); }
    if (!r.ok) throw new Error(data.detail || `HTTP ${r.status}`);
    a.textContent = "";
    const body = document.createElement("div");
    body.className = "md";
    const known = new Set(data.sources.map((s) => s.ref));
    body.innerHTML = Markdown.renderMarkdown(data.answer, {citeHref: (n) => known.has(n) ? `#src-${id}-${n}` : null});
    a.appendChild(body);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${((performance.now() - t0) / 1000).toFixed(1)} s · ${data.sources.length} source(s)`;
    a.appendChild(meta);
    if (data.sources.length) {
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = "Sources";
      det.appendChild(sum);
      for (const s of data.sources) {
        const div = document.createElement("div");
        div.className = "src";
        div.id = `src-${id}-${s.ref}`;
        const head = document.createElement("div");
        head.className = "src-head";
        head.textContent = `[${s.ref}] ${s.source}${s.section ? " — " + s.section : ""} · pertinence ${s.relevance}`;
        const ex = document.createElement("div");
        ex.className = "md";
        ex.innerHTML = Markdown.renderMarkdown(s.excerpt);
        div.append(head, ex);
        det.appendChild(div);
      }
      a.appendChild(det);
      // Clic sur une référence [n] : ouvre les sources et met l'extrait en évidence.
      body.addEventListener("click", (ev) => {
        const link = ev.target.closest("a.cite");
        if (!link) return;
        ev.preventDefault();
        det.open = true;
        const target = document.getElementById(link.getAttribute("href").slice(1));
        target.scrollIntoView({behavior: "smooth", block: "center"});
        target.classList.add("flash");
        setTimeout(() => target.classList.remove("flash"), 1200);
      });
    }
  } catch (err) {
    a.textContent = "Erreur : " + err.message;
    a.classList.add("err");
  } finally {
    b.disabled = false; q.focus();
  }
});

q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); }
});
</script>
</body>
</html>
