[project]
name = "resilience-rag"
version = "0.1.0"
description = "RESILIENCE-ALPHA — assistant opérateur local (Ollama + LangChain + Chroma)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "langchain-core>=1.6",
    "langchain-ollama>=1.1",
    "langchain-chroma>=1.1",
    "langchain-text-splitters>=1.1",
    "pypdf>=6.21",
    "tzdata>=2025.2",  # fuseau Europe/Paris dans l'image slim (heure actuelle donnée au modèle)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
