[project]
name = "resilience-remediation"
version = "0.1.0"
description = "RESILIENCE-ALPHA — moteur de remédiation (alerte → décision → action Ansible → vérification)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
