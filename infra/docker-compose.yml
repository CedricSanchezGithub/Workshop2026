# PROJECT RESILIENCE-ALPHA — socle d'infrastructure (G6) — WOR-43
# Stack imposée : Prometheus (métriques), Loki (journaux), Grafana (visualisation)
# + PostgreSQL pour le SI de paiement.
#
# À compléter : auth, payment-api, frontend, dashboard, remediation, waf, ml-inference, rag
# (les services métier rejoignent le réseau "backend" pour joindre postgres:5432).
#
# Exposition réseau :
#   - Grafana        -> ${GRAFANA_BIND}:3000 (127.0.0.1 en dev, 192.168.137.1 le jour de la démo)
#   - Prometheus/Loki -> 127.0.0.1 uniquement (accès local pour le ML / debug)
#   - PostgreSQL     -> jamais publié, réseau "backend" interne
#   - Vault          -> 127.0.0.1:8200 uniquement (UI / Ansible)
#
# Secrets (WOR-62) : stockés dans Vault, rendus en fichiers par vault-agent sur des volumes
# en mémoire, lus via *_FILE. Aucun mot de passe dans .env ni dans l'environnement des conteneurs.
# Vault doit être initialisé/descellé : passer par `ansible-playbook playbooks/deploy.yml`.

name: resilience-alpha

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  vault:
    <<: *hardening
    image: hashicorp/vault:2.2.0
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - secrets
    cap_drop: [ALL]
    # 200 uniquement si Vault est initialisé, descellé et actif
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  vault-agent:
    <<: *hardening
    image: hashicorp/vault:2.2.0
    command: ["vault", "agent", "-config=/vault/config/agent.hcl"]
    volumes:
      - ./vault/agent.hcl:/vault/config/agent.hcl:ro
      # Identifiants AppRole générés par Ansible (infra/secrets/, ignoré par Git)
      - type: bind
        source: ./secrets/approle/role_id
        target: /vault/approle/role_id
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/approle/secret_id
        target: /vault/approle/secret_id
        read_only: true
        bind:
          create_host_path: false
      - secrets-postgres:/secrets/postgres
      - secrets-grafana:/secrets/grafana
    networks:
      - secrets
    cap_drop: [ALL]
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /secrets/postgres/password && test -s /secrets/grafana/admin_password"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  postgres:
    <<: *hardening
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres/password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      # Postgres 18 : le volume se monte sur le dossier parent (PGDATA=/var/lib/postgresql/18/docker)
      - postgres-data:/var/lib/postgresql
      - secrets-postgres:/run/secrets/postgres:ro
    networks:
      - backend
    # Moindre privilège (WOR-63) : l'entrypoint prépare le datadir (chown) puis bascule sur
    # l'utilisateur postgres (su-exec). Seules ces capacités sont nécessaires.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    depends_on:
      vault-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  loki:
    <<: *hardening
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitoring
    cap_drop: [ALL]
    # Image distroless (ni shell ni wget) : pas de healthcheck Docker possible.
    # La disponibilité est vérifiée par Ansible (GET /ready) et par Prometheus (up{job="loki"}).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Seul composant qui touche au socket Docker : ne laisse passer que la LECTURE de la liste
  # des conteneurs et de leurs journaux, et uniquement pour Alloy (WOR-46).
  socket-proxy:
    <<: *hardening
    image: wollomatic/socket-proxy:1.13.1
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -allowGET=^(/v[0-9.]+)?/(_ping|version|networks|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs))$$
      - -allowHEAD=^(/v[0-9.]+)?/_ping$$
      - -watchdoginterval=30
      - -stoponwatchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Utilisateur nobody + groupe propriétaire du socket sur l'hôte (détecté par Ansible)
    group_add:
      - "${DOCKER_GID:?DOCKER_GID manquant dans .env (gid du socket Docker, renseigné par deploy.yml)}"
    networks:
      - docker-api
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  alloy:
    <<: *hardening
    image: grafana/alloy:v1.21.0
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data", "--server.http.listen-addr=0.0.0.0:12345"]
    user: "473:473"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Positions de lecture persistées : sans elles, un redémarrage renvoie tout l'historique
      # des conteneurs à Loki et double les comptages (constaté sur le labo WOR-91)
      - alloy-data:/var/lib/alloy/data
    networks:
      - docker-api
      - monitoring
    cap_drop: [ALL]
    depends_on:
      - socket-proxy
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER manquant dans .env}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana/admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # La démo doit fonctionner hors ligne
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - secrets-grafana:/run/secrets/grafana:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    networks:
      - monitoring
    cap_drop: [ALL]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      vault-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  # API métier de paiement (WOR-35) — application « Pay&Go » de Michael (app/), intégrée
  # DERRIÈRE le WAF et dans l'observabilité de la plateforme.
  # Construite depuis app/ (Express/TypeScript). Mode in-memory (pas de dépendance BDD ici) :
  # le driver postgres de Pay&Go reste utilisable mais la persistance n'est pas encore câblée
  # sur le Postgres de la plateforme (suivi : WOR-33/WOR-35). Expose /metrics (Prometheus,
  # format texte) et des logs JSON sur stdout avec client_ip (Loki) — contrat WOR-29/WOR-37.
  payment-api:
    <<: *hardening
    build:
      context: ../app
      dockerfile: infra/docker/Dockerfile.api
    image: resilience-alpha/payment-api:dev
    user: node                      # non-root (durcissement WOR-63)
    environment:
      PORT: "8080"                  # le WAF proxifie vers payment-api:8080
      WEB_ORIGIN: "http://127.0.0.1,http://localhost"
    networks:
      - backend      # reçoit le trafic du WAF
      - monitoring   # Prometheus scrape /metrics
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M

  # Reconnaissance faciale (WOR-95) — IA légère (InsightFace) appelée par le back-office
  # pour la MFA (consigne additionnelle 1). Interne, jamais publiée. Stocke uniquement des
  # embeddings (RGPD, WOR-101). /metrics -> Prometheus, logs JSON -> Loki.
  face-recognition:
    <<: *hardening
    build:
      context: ../services/face-recognition
    image: resilience-alpha/face-recognition:dev
    environment:
      FACE_THRESHOLD: "0.40"
    volumes:
      - face-data:/data
    networks:
      - backend      # appelée par le back-office
      - monitoring   # Prometheus scrape /metrics
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # WAF applicatif (WOR-60) : ModSecurity + OWASP CRS en reverse-proxy devant l'API/le front.
  # Point d'entrée publié unique de l'application ; bloque les injections (règles CRS 942xxx)
  # AVANT d'atteindre le backend, et journalise chaque blocage en JSON sur stdout —
  # collecté par Alloy -> Loki (SIEM, WOR-61 ; signaux figés dans docs/attack-scenarios.md).
  waf:
    <<: *hardening
    image: owasp/modsecurity-crs:4.30.0-nginx-alpine-202610180210
    environment:
      # Moteur de règles actif (blocage réel, pas seulement détection)
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      # Journal d'audit JSON sur stdout (flux unique), uniquement les requêtes pertinentes
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG_TYPE: "Serial"
      MODSEC_AUDIT_LOG: "/dev/stdout"
      MODSEC_AUDIT_LOG_FORMAT: "JSON"
      # Backend applicatif : payment-api (à venir). Tant qu'il n'existe pas, le WAF répond 502
      # sur le trafic légitime mais bloque déjà les injections (403) — cf scénario B (WOR-59).
      BACKEND: "http://payment-api:8080"
      PORT: "8080"
      SERVER_NAME: "resilience-alpha"
    volumes:
      # Surcharge de l'include proxy : résolution différée du backend (le WAF démarre sans l'API)
      - ./waf/templates/includes/proxy_backend.conf.template:/etc/nginx/templates/includes/proxy_backend.conf.template:ro
    ports:
      - "${WAF_BIND:-127.0.0.1}:8080:8080"
    networks:
      - edge      # port publié (attaquant -> WAF)
      - backend   # WAF -> payment-api (réseau métier interne)
    # nginx tourne déjà en utilisateur non-root ; aucune capacité nécessaire (WOR-63)
    cap_drop: [ALL]
    # 502 tant que le backend est absent ; curl sans -f sort 0 dès que nginx répond => WAF up
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  # Données métier : aucun accès sortant, aucun port publiable
  backend:
    internal: true
  monitoring: {}
  # Périmètre exposé : seul le WAF y publie un port (point d'entrée de l'application)
  edge: {}
  # Vault + agent ; non interne uniquement pour publier l'UI/API sur 127.0.0.1
  secrets: {}
  # socket-proxy <-> alloy uniquement
  docker-api:
    internal: true

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  vault-data:
  alloy-data:
  face-data:        # embeddings faciaux (WOR-95) — pas d'images brutes (RGPD)
  # Secrets rendus par vault-agent : en mémoire uniquement (jamais sur disque),
  # un volume par service consommateur. uid/gid = utilisateur "vault" de l'image.
  secrets-postgres:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
  secrets-grafana:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=100,gid=1000,mode=0755,size=1m"
