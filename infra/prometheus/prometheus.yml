# Prometheus — scrape config (WOR-45)
# Intervalle court : la détection doit tenir dans le Clip Chrono (60 s).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    platform: resilience-alpha

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # API métier (WOR-35) : signaux du scénario A (débit, latence, 5xx, payments_total)
  - job_name: payment-api
    static_configs:
      - targets: ["payment-api:8080"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
