# Blocage automatique par le moteur de remédiation (WOR-38/39).
# La liste est écrite UNIQUEMENT par le playbook ansible/playbooks/remediation/waf-block-ip.yml,
# puis prise en compte par un rechargement de nginx. Elle contient toujours au moins une adresse
# de documentation (RFC 5737), jamais routée, pour que le fichier ne soit jamais vide.
SecRule REMOTE_ADDR "@ipMatchFromFile /etc/modsecurity.d/remediation/blocked-ips.txt" \
    "id:1001,phase:1,deny,status:403,log,auditlog,\
    msg:'IP bloquée automatiquement par le moteur de remédiation',\
    tag:'resilience-alpha/remediation'"
